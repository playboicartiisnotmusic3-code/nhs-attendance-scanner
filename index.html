<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NHS Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      background: white;
      font-size: 22px;
      font-weight: bold;
      white-space: pre-line;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success {
      background: #c8f7c5 !important;
    }

    .error {
      background: #ffc7c7 !important;
    }

    .processing {
      background: #fff0b3 !important;
    }

    .late {
      background: #ffe08a !important;
    }
  </style>

</head>

<body>

  <h1>NHS Attendance Scanner</h1>

  <p>Point the rear camera at the barcode.</p>

  <div id="reader"></div>

  <div id="result">
    Waiting for barcode...
  </div>


  <script>

    /*
     * ============================================================
     * GOOGLE APPS SCRIPT BACKEND
     * ============================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwYY1ckEnzLWmqgVi_u0qa1pH72d-bnlomh2ZPJ-IbDz5sNch3jiM9HnFvzqNJvuY3J/exec";


    /*
     * ============================================================
     * SCANNER STATE
     * ============================================================
     */

    let processing = false;

    let lastScanned = "";

    let lastScanTime = 0;


    /*
     * ============================================================
     * DISPLAY RESULT
     * ============================================================
     */

    function showResult(message, type) {

      const result =
        document.getElementById("result");

      result.textContent = message;

      result.className = type;

    }


    /*
     * ============================================================
     * SEND ID TO GOOGLE APPS SCRIPT
     *
     * Uses JSONP instead of fetch().
     *
     * This avoids the cross-origin/CORS problem that occurs
     * when GitHub Pages communicates with Google Apps Script.
     * ============================================================
     */

    function sendIDToServer(id) {

      const callbackName =
        "nhsCallback_" + Date.now();


      /*
       * Create callback function that Google Apps Script
       * will call with the result.
       */

      window[callbackName] = function(data) {

        console.log("Server response:", data);


        if (data.success) {

          showResult(
            "✓ ID FOUND\n\n" +
            data.firstName +
            " " +
            data.lastName +
            "\n\nID: " +
            data.id,
            "success"
          );

        } else {

          showResult(
            "❌ " +
            data.message,
            "error"
          );

        }


        delete window[callbackName];


        const oldScript =
          document.getElementById(callbackName);

        if (oldScript) {
          oldScript.remove();
        }


        setTimeout(function() {

          processing = false;

        }, 1000);

      };


      const script =
        document.createElement("script");


      script.id =
        callbackName;


      script.src =
        API_URL +
        "?id=" +
        encodeURIComponent(id) +
        "&callback=" +
        encodeURIComponent(callbackName);


      script.onerror = function() {

        console.error(
          "Could not contact Google Apps Script."
        );


        showResult(
          "❌ CONNECTION ERROR\n\n" +
          "Could not contact attendance server.",
          "error"
        );


        delete window[callbackName];

        script.remove();


        setTimeout(function() {

          processing = false;

        }, 1000);

      };


      document.body.appendChild(script);

    }


    /*
     * ============================================================
     * BARCODE SUCCESS
     * ============================================================
     */

    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      decodedText =
        decodedText.trim();


      const now =
        Date.now();


      if (
        decodedText === lastScanned &&
        now - lastScanTime < 1500
      ) {

        return;

      }


      lastScanned =
        decodedText;

      lastScanTime =
        now;


      if (!/^\d{6}$/.test(decodedText)) {

        showResult(
          "❌ INVALID BARCODE\n\n" +
          "The scanned value must be\n" +
          "exactly 6 digits.",
          "error"
        );

        return;
      }


      processing = true;


      showResult(
        "⏳ Checking ID\n\n" +
        decodedText +
        "...",
        "processing"
      );


      sendIDToServer(decodedText);

    }


    function onScanFailure(error) {

      // Normal scanning failures are ignored.

    }


    /*
     * ============================================================
     * START CAMERA SCANNER
     * ============================================================
     */

    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 150
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]

        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NHS Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      background: white;
      font-size: 22px;
      font-weight: bold;
      white-space: pre-line;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success {
      background: #c8f7c5 !important;
    }

    .error {
      background: #ffc7c7 !important;
    }

    .processing {
      background: #fff0b3 !important;
    }

    .late {
      background: #ffe08a !important;
    }
  </style>

</head>

<body>

  <h1>NHS Attendance Scanner</h1>

  <p>Point the rear camera at the barcode.</p>

  <div id="reader"></div>

  <div id="result">
    Waiting for barcode...
  </div>


  <script>

    /*
     * ============================================================
     * GOOGLE APPS SCRIPT BACKEND
     * ============================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwGI7QAfnOk37-N6m2Mgb-vTOaScfh--fD2h5D8PjhM7kplUw6v-0biNn4te2iyeA8/exec";


    /*
     * ============================================================
     * SCANNER STATE
     * ============================================================
     */

    let processing = false;

    let lastScanned = "";

    let lastScanTime = 0;


    /*
     * ============================================================
     * DISPLAY RESULT
     * ============================================================
     */

    function showResult(message, type) {

      const result =
        document.getElementById("result");

      result.textContent = message;

      result.className = type;

    }


    /*
     * ============================================================
     * SEND ID TO GOOGLE APPS SCRIPT
     *
     * Uses JSONP instead of fetch().
     *
     * This avoids the cross-origin/CORS problem that occurs
     * when GitHub Pages communicates with Google Apps Script.
     * ============================================================
     */

    function sendIDToServer(id) {

      const callbackName =
        "nhsCallback_" + Date.now();


      /*
       * Create callback function that Google Apps Script
       * will call with the result.
       */

      window[callbackName] = function(data) {

        console.log("Server response:", data);


        if (data.success) {

          /*
           * Successful ID
           */

          showResult(
            "✓ ID FOUND\n\n" +
            data.firstName +
            " " +
            data.lastName +
            "\n\nID: " +
            data.id,
            "success"
          );

        } else {

          /*
           * Server rejected the ID
           */

          showResult(
            "❌ " +
            data.message,
            "error"
          );

        }


        /*
         * Clean up callback.
         */

        delete window[callbackName];


        const oldScript =
          document.getElementById(callbackName);

        if (oldScript) {
          oldScript.remove();
        }


        /*
         * Allow another scan after 1 second.
         */

        setTimeout(function() {

          processing = false;

        }, 1000);

      };


      /*
       * Create script request.
       *
       * Because this is a <script> request, the browser
       * does not apply the normal fetch() CORS restriction.
       */

      const script =
        document.createElement("script");


      script.id =
        callbackName;


      script.src =
        API_URL +
        "?id=" +
        encodeURIComponent(id) +
        "&callback=" +
        encodeURIComponent(callbackName);


      /*
       * Handle connection failure.
       */

      script.onerror = function() {

        console.error(
          "Could not contact Google Apps Script."
        );


        showResult(
          "❌ CONNECTION ERROR\n\n" +
          "Could not contact attendance server.",
          "error"
        );


        delete window[callbackName];

        script.remove();


        setTimeout(function() {

          processing = false;

        }, 1000);

      };


      /*
       * Add request to page.
       */

      document.body.appendChild(script);

    }


    /*
     * ============================================================
     * BARCODE SUCCESS
     * ============================================================
     */

    function onScanSuccess(decodedText) {

      /*
       * Do not process another barcode while the current
       * one is being checked.
       */

      if (processing) {
        return;
      }


      /*
       * Remove accidental spaces.
       */

      decodedText =
        decodedText.trim();


      const now =
        Date.now();


      /*
       * html5-qrcode can detect the same barcode many times
       * while it is sitting in front of the camera.
       *
       * Ignore the same barcode for 3 seconds.
       */

      if (
        decodedText === lastScanned &&
        now - lastScanTime < 3000
      ) {

        return;

      }


      lastScanned =
        decodedText;

      lastScanTime =
        now;


      /*
       * ========================================================
       * STRICT ID VALIDATION
       * ========================================================
       *
       * NHS IDs must be exactly 6 digits.
       *
       * Examples:
       *
       * 123456  -> accepted
       * 012345  -> accepted
       * 12345   -> rejected
       * 1234567 -> rejected
       * ABC123  -> rejected
       *
       * This prevents the scanner from accidentally accepting
       * only part of an invalid barcode.
       */

      if (!/^\d{6}$/.test(decodedText)) {

        showResult(
          "❌ INVALID BARCODE\n\n" +
          "The scanned value must be\n" +
          "exactly 6 digits.",
          "error"
        );

        return;
      }


      /*
       * Lock scanner processing.
       */

      processing = true;


      /*
       * Show loading state.
       */

      showResult(
        "⏳ Checking ID\n\n" +
        decodedText +
        "...",
        "processing"
      );


      /*
       * Send ID to backend.
       */

      sendIDToServer(decodedText);

    }


    /*
     * ============================================================
     * SCAN FAILURE
     * ============================================================
     *
     * html5-qrcode calls this constantly while looking for a
     * barcode, so we intentionally do nothing here.
     */

    function onScanFailure(error) {

      // Normal scanning failures are ignored.

    }


    /*
     * ============================================================
     * START CAMERA SCANNER
     * ============================================================
     */

    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          /*
           * Scan approximately 10 times per second.
           */

          fps: 10,


          /*
           * Rectangle where the barcode should be positioned.
           */

          qrbox: {
            width: 300,
            height: 150
          },


          /*
           * Remember the camera selected by the user.
           */

          rememberLastUsedCamera: true,


          /*
           * Only allow camera scanning.
           */

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]

        },

        false
      );


    /*
     * Display scanner.
     */

    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>

</html>

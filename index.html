<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NHS Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      background: white;
      font-size: 22px;
      font-weight: bold;
      white-space: pre-line;
    }

    .success {
      background: #c8f7c5 !important;
    }

    .error {
      background: #ffc7c7 !important;
    }

    .processing {
      background: #fff0b3 !important;
    }
  </style>

</head>

<body>

  <h1>NHS Attendance Scanner</h1>

  <p>Point the rear camera at the barcode.</p>

  <div id="reader"></div>

  <div id="result">
    Waiting for barcode...
  </div>


  <script>

    // YOUR GOOGLE APPS SCRIPT WEB APP URL
    const API_URL =
      "https://script.google.com/macros/s/AKfycbywDRCkZslf-LXKNvwev1vsF1iahWsY0TBWWz93JsCLQTBwXJv4ChtN469aQO-DNt8H/exec";


    let processing = false;
    let lastScanned = "";
    let lastScanTime = 0;


    function showResult(message, type) {

      const result =
        document.getElementById("result");

      result.textContent = message;

      result.className = type;

    }


    async function sendIDToServer(id) {

      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body:
              "id=" +
              encodeURIComponent(id)

          });


        const data =
          await response.json();


        if (data.success) {

          showResult(
            "✓ ID FOUND\n" +
            data.firstName +
            " " +
            data.lastName +
            "\n\nID: " +
            data.id,
            "success"
          );

        } else {

          showResult(
            "❌ " +
            data.message,
            "error"
          );

        }


      } catch (error) {

        console.error(error);

        showResult(
          "❌ CONNECTION ERROR\n" +
          "Could not contact attendance server.",
          "error"
        );

      }


      // Allow another scan after 1 second.
      setTimeout(function() {
        processing = false;
      }, 1000);

    }


    function onScanSuccess(decodedText) {

      if (processing) {
        return;
      }


      decodedText =
        decodedText.trim();


      const now =
        Date.now();


      // Ignore repeated detection
      // of the same barcode.
      if (
        decodedText === lastScanned &&
        now - lastScanTime < 3000
      ) {

        return;

      }


      lastScanned =
        decodedText;

      lastScanTime =
        now;


      // IMPORTANT:
      // Only accept exactly six digits.
      if (!/^\d{6}$/.test(decodedText)) {

        showResult(
          "❌ INVALID BARCODE\n\n" +
          "The scanned value must be\n" +
          "exactly 6 digits.",
          "error"
        );

        return;
      }


      processing = true;


      showResult(
        "⏳ Checking ID " +
        decodedText +
        "...",
        "processing"
      );


      sendIDToServer(decodedText);

    }


    function onScanFailure(error) {

      // Normal camera scanning failures
      // are ignored.

    }


    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 150
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]
        },

        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>

</html>
